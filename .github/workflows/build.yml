name: Build Shopee Affiliate Agent EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64 EXE
        run: dotnet publish ShopeeAffiliateAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeAffiliateAgent-Windows-x64
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14
